name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # [tokens] pulls tiktoken so the BPE counting path is exercised too,
      # not just the char-density fallback.
      - name: Install package
        run: pip install -e ".[tokens]" pytest

      - name: Run test suite
        run: pytest -q

      - name: Verify CLI
        run: claudio --version

      - name: Verify help
        run: claudio --help

      - name: Dry-run test
        run: claudio ask -question --dry-run "test"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check claudio tests
